apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-deployment
  namespace: star
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy
    spec:
      containers:
      - name: swiggy-container
        image: prashikrk/swiggy
        ports:
        - containerPort: 3010
---
apiVersion: v1
kind: Service
metadata:
  name: swiggy-service
  namespace: star
spec:
  type: NodePort
  selector:
    app: swiggy
  ports:
  - port: 80
    targetPort: 3010
    nodePort: 30001 # Choose a port between 30000-32767
